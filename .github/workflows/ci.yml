name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pyjch tests scripts
      - name: pylint
        run: pylint src/pyjch tests scripts
      - name: Cache HVSC corpus tunes
        # Tunes are HVSC copyright works, never committed; they are fetched from
        # the public HVSC mirror into a gitignored cache and reused across runs.
        uses: actions/cache@v6
        with:
          path: tests/.tunecache
          key: >-
            hvsc-corpus-${{ hashFiles('tests/test_corpus.py',
            'tests/conftest.py', 'scripts/fetch_tunes.py') }}
      - name: Fetch corpus tunes (HVSC mirror; cached)
        run: python scripts/fetch_tunes.py --corpus
      - name: pytest + coverage (> 85%)
        # The real HVSC tunes are present (fetched + cached), so the corpus
        # reader/extract/editor tests RUN (not skip), exercising the reader,
        # model recovery and the V0x player for real; the V20 player is driven
        # offline by the synthetic image. Oracle byte-exact tests run in the
        # dedicated ``oracle`` job below.
        env:
          PYJCH_FETCH_CORPUS: "1"
        run: pytest --cov=pyjch --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of the JchPlayer render against the sidtrace
    # sidplayfp oracle over real HVSC tunes, for BOTH driver versions (V0x and
    # V20). Never skipped: a failed HVSC download or oracle render fails the
    # job. HVSC tunes and oracle CSVs are cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pull sidtrace oracle image
        id: image
        run: |
          docker pull anarkiwi/sidtrace:latest
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' anarkiwi/sidtrace:latest)
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Cache HVSC tunes
        uses: actions/cache@v6
        with:
          path: .oracle-cache/hvsc
          key: hvsc-oracle-${{ hashFiles('tests/test_oracle_hvsc.py') }}
          restore-keys: hvsc-oracle-
      - name: Cache oracle CSVs
        uses: actions/cache@v6
        with:
          path: .oracle-cache/csv
          key: oracle-csv-${{ steps.image.outputs.digest }}-${{ hashFiles('tests/test_oracle_hvsc.py') }}
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pyjch; print(pyjch.__version__)"
          pyjch --help
