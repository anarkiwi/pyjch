name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pyjch tests
      - name: pylint
        run: pylint src/pyjch tests
      - name: Cache HVSC corpus tunes
        # Tunes are HVSC copyright works, never committed; they are fetched from
        # the public HVSC mirror into a gitignored cache and reused across runs.
        uses: actions/cache@v6
        with:
          path: .tunecache
          key: >-
            hvsc-corpus-${{ hashFiles('tests/**/*.py') }}
      - name: Fetch corpus tunes (HVSC mirror; cached)
        run: pysid-tune-fetch --tests tests/
      - name: pytest + coverage (> 85%)
        # The real HVSC tunes are pre-fetched + cached above, so the corpus
        # reader/extract/editor tests RUN (never skip), exercising the reader,
        # model recovery and the V0x player for real; any tune not already cached
        # is fetched on demand from the mirror. The V20 player is driven offline
        # by the synthetic image. Oracle byte-exact tests run in the dedicated
        # ``oracle`` job below.
        run: pytest --cov=pyjch --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of the JchPlayer render against the sidtrace
    # sidplayfp oracle over real HVSC tunes, for BOTH driver versions (V0x and
    # V20). Never skipped: a failed HVSC download or oracle render fails the
    # job. HVSC tunes and oracle CSVs are cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pull sidtrace oracle image
        id: image
        run: |
          docker pull anarkiwi/sidtrace:latest
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' anarkiwi/sidtrace:latest)
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Cache oracle tunes + CSVs
        # One cache for the whole tune cache (HVSC .sid tree + the csv/ oracle
        # traces). Keyed on the sidtrace image digest so a new oracle image
        # invalidates the cached CSVs (they are regenerated), never reusing stale
        # traces; the test file is in the key so tune-set changes refetch.
        uses: actions/cache@v6
        with:
          path: .tunecache
          key: oracle-${{ steps.image.outputs.digest }}-${{ hashFiles('tests/test_oracle_hvsc.py') }}
          restore-keys: oracle-
      - name: Pre-cache oracle tunes
        run: pysid-tune-fetch --tests tests/
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pyjch; print(pyjch.__version__)"
          pyjch --help
