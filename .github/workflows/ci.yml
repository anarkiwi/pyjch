name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pyjch tests scripts
      - name: pylint
        run: pylint src/pyjch tests scripts
      - uses: anarkiwi/pysidtracker/.github/actions/cache@v0.45.0
        with:
          key: ${{ hashFiles('tests/**/*.py') }}
          tunes: tests
      - name: pytest + coverage (> 85%)
        # The corpus reader/extract/editor tests run on the real HVSC tunes the
        # cache action restores and pre-fetches. Oracle byte-exact tests run in
        # the dedicated ``oracle`` job below.
        if: matrix.python-version != '3.12'
        run: pytest --cov=pyjch --cov-report=term-missing --cov-fail-under=85
      - name: pytest + coverage (> 85%), sysmon
        # Python 3.12's line tracer slows the generated playspec code about
        # 1000-fold; the sysmon core avoids it but cannot measure branches there.
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_RCFILE: ci/coverage-sysmon.rc
        run: pytest --cov=pyjch --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of the JchPlayer render against the sidtrace
    # sidplayfp oracle over real HVSC tunes, for the V0x driver and every
    # recovered family version (V1-V18, V20). Never skipped: a failed HVSC
    # download or oracle render fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: anarkiwi/pysidtracker/.github/actions/cache@v0.45.0
        with:
          key: ${{ hashFiles('tests/test_oracle_hvsc.py') }}
          sidtrace: "true"
          tunes: tests/test_oracle_hvsc.py
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pyjch; print(pyjch.__version__)"
          # pyjch ships no binary; it registers a `jch` format with the shared
          # `pysidtracker` CLI. Verify the entry point resolves and the CLI runs.
          python -c "from pysidtracker import discover_formats; assert any(f.name == 'jch' for f in discover_formats()), 'jch format not registered'"
          pysidtracker export --help
