name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pyjch tests scripts
      - name: pylint
        run: pylint src/pyjch tests scripts
      - name: Cache HVSC corpus tunes
        # Tunes are HVSC copyright works, never committed; they are fetched from
        # the public HVSC mirror into a gitignored cache and reused across runs.
        # Keyed on the files that define the corpus + the fetch script, so the
        # cache re-populates when the tune list changes.
        uses: actions/cache@v6
        with:
          path: tests/.tunecache
          key: >-
            hvsc-corpus-${{ hashFiles('tests/test_corpus.py',
            'tests/test_v20player.py', 'tests/conftest.py',
            'scripts/fetch_tunes.py') }}
      - name: Fetch corpus tunes (HVSC mirror; cached)
        run: python scripts/fetch_tunes.py --corpus
      - name: pytest + coverage (> 85%)
        # The real HVSC tunes are now present (fetched + cached), so the corpus
        # reader tests and the V20 py65 byte-exact oracle tests RUN (not skip),
        # exercising newplayer.py / v20player.py for real.  V0x byte-exact tests
        # validate against the committed frozen oracle grids.  PYJCH_FETCH_CORPUS
        # lets any tune missing from the cache be fetched on demand.
        env:
          PYJCH_FETCH_CORPUS: "1"
        run: pytest -n auto --cov=pyjch --cov-report=term-missing --cov-fail-under=85

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pyjch; print(pyjch.__version__)"
          pyjch --help
